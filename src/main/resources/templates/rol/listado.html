<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}">
        <title>[[#{plantilla.troles}]]</title>
    </head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>
        <section class="container mt-5">
            <h2 class="mb-4">
                <i class="fas fa-user-shield"></i> [[#{plantilla.troles}]]
            </h2>

            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-list"></i> [[#{plantilla.troles}]]</h5>
                    <span class="badge bg-light text-dark">[[${totalRoles}]]</span>
                </div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(roles)}" class="p-3 text-center text-muted">
                        Sin roles registrados.
                    </div>
                    <table th:unless="${#lists.isEmpty(roles)}" class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="rol : ${roles}">
                                <td>[[${rol.idRol}]]</td>
                                <td>[[${rol.rol}]]</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
